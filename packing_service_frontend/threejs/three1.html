            .css_style {
                background-color: MidnightBlue;

                ;

                border-bottom: 18px solid transparent;
                border-left: 8px solid transparent;

                ;
                position: absolute;
                /* left: 100%; */
                top: 100%;
                /* margin-top: 18px; */
                margin-right: 18px;
            }
