server {
	listen 80 default_server;
	listen [::]:80 default_server;

        gzip off;
        gzip_min_length 1k;
        gzip_comp_level 9;
        gzip_vary on;
        gzip_buffers 4 16k;
        # gzip_static on;

        # gzip_comp_level 6;
        # gzip_buffers 16 8k;
        gzip_http_version 1.1;
        gzip_types application/javascript;


	root /var/www/html;

	index index.html;

	server_name _;

	#location /image {
	#	rewrite ^/image/(.*)$ /$1 break;
	#	proxy_pass http://192.168.21.211;
	#}

	location / {
		# First attempt to serve request as file, then
		# as directory, then fall back to displaying a 404.
		try_files $uri $uri/ /index.html;
	}

}
