# =====================================================
# Docker Profile 配置（覆盖 application.yml）
# 激活方式：-Dspring.profiles.active=docker
# =====================================================

# 数据库连接：指向 docker-compose 中的 mysql 服务容器
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/${MYSQL_DB:db_kindlead}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_ROOT_PASSWORD:P6bTmGZd}
    driver-class-name: com.mysql.cj.jdbc.Driver
  application:
    name: packing-service
# Python API 服务配置（路径改为 Linux 风格）
packing-python-api:
  host: ${PYTHON_API_HOST:http://host.docker.internal}
  port: ${PYTHON_API_PORT:5000}
  route: /api
  methods: GET
  source_save_path: /data/source/
  result_save_path: /data/result/
  middle_save_path: /data/middle/
  push_save_path: /data/push/
  image_path: /data/images/

# 日志输出到 /data/logs/
logging:
  level:
    root: INFO
  file:
    name: /data/logs/myapp.log
